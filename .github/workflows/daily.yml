name: Palabra del día

on:
  schedule:
    - cron: "0 23 * * *" # 01:00 CEST (summer)
    - cron: "0 0 * * *" # 01:00 CET (winter)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/**"
      - "data/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/daily.yml"

permissions:
  contents: read

concurrency:
  group: palabra-del-dia
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$SCHEDULE" in
            "0 0 * * *") expected="+0100" ;;
            "0 23 * * *") expected="+0200" ;;
            *) echo "run=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          offset=$(TZ=Europe/Madrid date +%z)
          previous=$(TZ=Europe/Madrid date -d '1 hour ago' +%H)
          if [ "$offset" != "$expected" ] || [ "$previous" = "01" ]; then
            echo "Not the active 01:00 Madrid schedule; skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  update:
    needs: guard
    if: needs.guard.outputs.run == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test the parser
        run: python -m unittest discover -s tests -v

      - name: Fetch and translate
        run: python scripts/daily.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "data: palabra del día $(date -u +%F)"
            git pull --rebase origin main
            git push
          fi

  deploy:
    needs: [guard, update]
    if: always() && !cancelled() && needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test the parser
        run: python -m unittest discover -s tests -v

      - name: Build the site
        run: python scripts/build.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
