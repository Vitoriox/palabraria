name: Palabra del día

on:
  schedule:
    - cron: "0 1 * * *" # 02:00 CET (03:00 CEST in summer)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/daily.yml"

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: palabra-del-dia
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test the parser
        run: python -m unittest discover -s tests -v

      - name: Fetch and translate
        run: python scripts/daily.py

      - name: Build the site
        run: python scripts/build.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
