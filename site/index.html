<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Palabra del día</title>
  <meta name="description" content="La palabra del día de la RAE, con su definición y su traducción al inglés y al alemán.">
  <meta name="theme-color" content="#f2ede4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141210" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <p class="date" id="date"></p>

    <section class="status" id="loading" role="status">
      <p>Cargando…</p>
    </section>

    <noscript>
      <p class="status">Esta página necesita JavaScript.</p>
    </noscript>

    <section class="status status--error" id="error" hidden>
      <p id="error-message"></p>
    </section>

    <article class="card" id="card" hidden>
      <h1 class="word">
        <a id="word-link" href="https://dle.rae.es/" target="_blank" rel="noopener"><span id="word"></span></a>
      </h1>

      <p class="definition" id="definition"></p>

      <div class="translations">
        <section class="translation" lang="en">
          <p class="translation__lang">English</p>
          <p class="translation__term" id="en-term"></p>
          <p class="translation__definition" id="en-definition"></p>
        </section>
        <section class="translation" lang="de">
          <p class="translation__lang">Deutsch</p>
          <p class="translation__term" id="de-term"></p>
          <p class="translation__definition" id="de-definition"></p>
        </section>
      </div>

      <p class="source"><a id="source-link" href="https://dle.rae.es/" target="_blank" rel="noopener">DLE · RAE-ASALE</a></p>
    </article>
  </main>

  <script src="app.js" defer></script>
</body>
</html>
